name: Release

# Publishes the verified binaries committed in release/ as a GitHub Release, so
# the APK and the Windows .exe can be downloaded straight from the Releases page.
#
#   1. Build and verify:  tools/build-apk.sh  and  tools/build-exe.sh
#   2. Commit release/ (binaries + .sha256) and, optionally, docs/releases/vX.Y.Z.md
#   3. Tag and push:      git tag vX.Y.Z && git push origin vX.Y.Z
#
# Nothing is rebuilt here: the files published are exactly the ones committed at
# the tag, so their checksums match the .sha256 files in the repository. The job
# refuses to publish unless the tag is a version (vX.Y.Z or vX.Y.Z-suffix), the
# matching release/VELTRIX-Wallet-vX.Y.Z* files exist at that tag, and every
# binary matches its committed .sha256. Notes come from docs/releases/<tag>.md
# when present (otherwise GitHub generates them); a tag with a suffix such as
# v1.1.0-beta.1 becomes a pre-release. Running it again for a tag that already
# has a release (Actions → Release → Run workflow) re-uploads the assets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Verify release binaries
        run: |
          version="${TAG#v}"
          cd release
          : > "$RUNNER_TEMP/assets.txt"
          for f in "VELTRIX-Wallet-v${version}.apk" "VELTRIX-Wallet-v${version}-win-x64.exe"; do
            if [ ! -f "$f" ] || [ ! -f "$f.sha256" ]; then
              echo "::error::release/$f and release/$f.sha256 must be committed at $TAG (build them with tools/build-apk.sh / tools/build-exe.sh)"
              exit 1
            fi
            sha256sum --check --strict "$f.sha256"
            printf 'release/%s\nrelease/%s.sha256\n' "$f" "$f" >> "$RUNNER_TEMP/assets.txt"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t assets < "$RUNNER_TEMP/assets.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; re-uploading its assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            args=(--verify-tag --title "VELTRIX Wallet $TAG")
            if [ -f "docs/releases/$TAG.md" ]; then
              args+=(--notes-file "docs/releases/$TAG.md")
            else
              args+=(--generate-notes)
            fi
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" "${assets[@]}" "${args[@]}"
          fi

          url="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "### Published [$TAG]($url)"
            echo
            echo '| File | Bytes | SHA-256 |'
            echo '|---|---:|---|'
            for f in "${assets[@]}"; do
              case "$f" in *.sha256) continue ;; esac
              echo "| \`${f#release/}\` | $(stat -c %s "$f") | \`$(cut -d' ' -f1 "$f.sha256")\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
