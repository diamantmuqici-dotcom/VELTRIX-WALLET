name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app

  apk:
    name: APK (reference build, no Gradle)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/veltrix-toolchain
          key: veltrix-toolchain-v1
      - run: bash tools/setup-toolchain.sh
      - run: bash tools/build-apk.sh
        env:
          SKIP_TESTS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: VELTRIX-Wallet-apk
          path: |
            release/VELTRIX-Wallet-v1.0.0.apk
            release/VELTRIX-Wallet-v1.0.0.apk.sha256

  ui:
    name: End-to-end UI tests
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tools/ui-test/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: app
      - run: npm ci --no-audit --no-fund
        working-directory: tools/ui-test
      - run: node run.mjs
        working-directory: tools/ui-test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-failures
          path: tools/ui-test/out/

  gradle:
    name: APK (Gradle / Android Studio build)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: app
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: VELTRIX-Wallet-gradle-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
