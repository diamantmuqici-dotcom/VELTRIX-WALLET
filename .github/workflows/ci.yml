name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app

  apk:
    name: APK (reference build, no Gradle)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/veltrix-toolchain
          key: veltrix-toolchain-v1
      - run: bash tools/setup-toolchain.sh
      - run: bash tools/build-apk.sh
        env:
          SKIP_TESTS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: VELTRIX-Wallet-apk
          path: |
            release/VELTRIX-Wallet-v1.0.0.apk
            release/VELTRIX-Wallet-v1.0.0.apk.sha256

  exe:
    name: Windows .exe (Zig cross-compile)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tools/ui-test/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "ziglang==0.14.1" pillow
      # The ziglang wheel does not always install a console script.
      - name: Locate the compiler
        run: echo "VELTRIX_ZIG=$(python -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')" >> "$GITHUB_ENV"
      # build-exe.sh cross-compiles the PE image, statically verifies it and runs
      # 27 functional checks against the same source built for the runner.
      - run: bash tools/build-exe.sh
        env:
          SKIP_TESTS: '1'
      - run: npm ci --no-audit --no-fund
        working-directory: tools/ui-test
      # Re-run the whole end-to-end suite against the bundle as the launcher
      # serves it, not against app/dist on disk.
      - name: End-to-end tests against the launcher
        working-directory: tools/ui-test
        run: |
          ../../desktop/build/launcher-host --print-url > /tmp/veltrix-url &
          for _ in $(seq 1 100); do URL="$(head -n1 /tmp/veltrix-url 2>/dev/null)"; [ -n "$URL" ] && break; sleep 0.1; done
          [ -n "$URL" ] || { echo "launcher did not start"; exit 1; }
          node run.mjs --base-url="$URL"
      - uses: actions/upload-artifact@v4
        with:
          name: VELTRIX-Wallet-windows-exe
          path: |
            release/VELTRIX-Wallet-v1.0.0-win-x64.exe
            release/VELTRIX-Wallet-v1.0.0-win-x64.exe.sha256

  ui:
    name: End-to-end UI tests
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tools/ui-test/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: app
      - run: npm ci --no-audit --no-fund
        working-directory: tools/ui-test
      - run: node run.mjs
        working-directory: tools/ui-test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-failures
          path: tools/ui-test/out/

  gradle:
    name: APK (Gradle / Android Studio build)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: app
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: VELTRIX-Wallet-gradle-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
